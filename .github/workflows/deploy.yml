name: Deploy to GP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build deployment structure
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build the site
        run: npm run build

      - name: Deploy to GH
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          cname: anltx.xyz